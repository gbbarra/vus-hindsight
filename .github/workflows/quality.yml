name: Quality gates

# Separate from benchmark.yml on purpose. That workflow downloads ClinVar and
# commits results back, so it is manual only; this one just checks the code and
# runs on every push and pull request.
#
# Each step below fails the run on a non-zero exit. The list mirrors
# CLAUDE.md section 4.6; where a gate is not enforced yet, the reason is stated
# next to it rather than left as a silent omission.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install --quiet duckdb numpy scikit-learn scipy PyYAML \
                              pytest pytest-cov pytest-bdd \
                              ruff mypy bandit detect-secrets
          python -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: Lint
        run: ruff check .

      # `ruff format --check` is NOT enforced yet. Adopting it would reformat 40
      # of 53 files at once, across scripts whose line numbers are cited in the
      # README and in docs/BRIEFING.md, and the repository carries a DOI. That
      # is a decision to take deliberately, not a side effect of adding CI.
      # Measured on 2026-08-05; see docs/TEST_PLAN.md section 6.4.

      - name: Types
        run: mypy

      - name: Tests and coverage
        run: pytest --cov=scripts --cov-branch --cov-report=term-missing

      # 95% per decision function and 80% aggregate over them (CLAUDE.md 4.3).
      # Reads the data the step above left behind.
      - name: Coverage floors
        run: python3 tests/check_coverage_floors.py

      # High severity only, per CLAUDE.md 4.6. The 47 medium findings are all
      # B608 — SQL assembled by string interpolation, which is what a DuckDB
      # pipeline is; no user input reaches a query.
      - name: Security
        run: bandit -r scripts/ tests/ -lll -q

      - name: Secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook \
              --baseline .secrets.baseline
