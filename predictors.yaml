# Registry of variant pathogenicity predictors, for the contamination audit.
#
# WHY THIS FILE EXISTS
#
# The labels in this benchmark are ClinVar reclassifications: a variant that was
# a VUS in 2021 and is Pathogenic today. Most predictors are trained on
# disease-variant databases, ClinVar among them. A predictor whose training data
# postdates the baseline may therefore have SEEN the answer, and any accuracy it
# shows on this benchmark is partly memorisation rather than prediction.
#
# HOW TO FILL THIS IN
#
# `training_cutoff` is the latest date of data that could have entered the
# model — usually the release date of the training database, not the paper's
# publication date. They can differ by years.
#
# Leave it null when you do not know. 11_contamination_audit.py treats a null or
# unsourced cutoff as its own tier and NEVER counts it as safe: an unverified
# tool is not a clean tool, it is an unmeasured one.
#
# `source` must point at where the cutoff is stated — a paper section, a release
# note, a README. "I think it was around 2015" is not a source, and the audit
# refuses to honour a cutoff whose `verified` flag is false.
#
# Nothing here has been filled from memory. Every cutoff below is null because
# it has to be read out of the literature, not recalled.

predictors:

  # ---- Benchmarked against VarPPUD (Yin et al., PLoS Comput Biol 2025) ------
  # These nine are the comparison set in that paper. Most are old, so most are
  # likely clean with respect to a 2021 baseline — but "likely" is what this
  # audit exists to replace with a sourced date.

  - name: SIFT
    version: null
    category: conservation
    training_cutoff: null
    training_data: []
    uses_clinvar: unknown
    source: null
    verified: false
    notes: >-
      Scores missense only. Conservation-based rather than supervised on a
      disease-variant set, which changes the contamination question: check what
      it was calibrated on rather than assuming none.

  - name: PolyPhen-2
    version: HumDiv
