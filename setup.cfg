# mutmut 3.x lê a configuração daqui, e recusa iniciar sem ela.
#
# Escopo deliberado: o alvo da mutação é a lógica de decisão clínica, não os
# main() de argparse e SQL, onde os mutantes levariam horas e matariam quase
# nada. Ver CLAUDE.md §4.4 e docs/TEST_PLAN.md §6.2.
#
# mutmut copia o código para mutants/ e roda os testes lá dentro, então tests/ e
# a configuração do pytest precisam ir junto.
[mutmut]
source_paths = scripts
only_mutate =
    scripts/aggregate.py
    scripts/schema.py
also_copy =
    tests/
    pyproject.toml
pytest_add_cli_args_test_selection =
    tests/unit/test_aggregate.py
    tests/unit/test_schema.py
