# mutmut 3.x reads its configuration from setup.cfg rather than pyproject.toml,
# and refuses to start without it. Scope is deliberate: the mutation target is
# the clinical decision logic, not the argparse-and-SQL main() functions, where
# mutants would take hours to run and kill almost nothing.
# See CLAUDE.md section 4.4 and docs/TEST_PLAN.md section 6.2.
[mutmut]
paths_to_mutate = scripts/aggregate.py, scripts/schema.py
tests_dir = tests/unit
